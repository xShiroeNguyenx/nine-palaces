name: Backup D1

# Sao lưu CSDL D1 hằng tuần thành artifact của GitHub Actions (miễn phí, giữ 90 ngày).
# Cần secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  schedule:
    - cron: '0 19 * * 0' # 02:00 sáng thứ Hai giờ Việt Nam
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export D1
        working-directory: apps/api
        run: npx wrangler d1 export nine-palaces --remote --output backup.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: apps/api/backup.sql
          retention-days: 90
